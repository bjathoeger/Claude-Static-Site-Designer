<!doctype html>
<html lang="en" data-site-root="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QualiWare</title>
<style>.i18n-pending body{visibility:hidden}</style>
<script>(function(){try{var l=new URL(location.href).searchParams.get('lang')||localStorage.getItem('site-lang');if(l&&l!=='en'){document.documentElement.classList.add('i18n-pending');setTimeout(function(){document.documentElement.classList.remove('i18n-pending')},1500)}}catch(e){}})();</script>
<script src="assets/js/i18n.js" defer></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif;color:#2e4163;background:#fff}
  main{max-width:640px;margin:20vh auto;padding:0 24px}
  h1{font-size:40px;line-height:1.1}
  p{font-size:18px;line-height:1.55}
</style>
</head>
<body>
<main>
  <h1 data-i18n="placeholder.title">This site is being built</h1>
  <p data-i18n="placeholder.body">The first page arrives with the first handoff from the design project.</p>
</main>
</body>
</html>
